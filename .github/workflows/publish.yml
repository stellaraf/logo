name: Publish to NPM
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: codebuild-stellaraf-actions-public-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Node Setup
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: PNPM Setup
        uses: pnpm/action-setup@v2.2.2
        with:
          version: latest
          run_install: true

      - name: Build
        run: pnpm run build

      - name: NPM Publish
        uses: JS-DevTools/npm-publish@v1
        with:
          token: ${{ secrets.NPM_TOKEN }}
